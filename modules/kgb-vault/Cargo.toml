[package]
name = "kgb-vault"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "K.G.B. module: the company's document vault (step 7.10a) - every document of the firm in one place, read without being changed, sorted into categories with a confidence and a reason, the invoices recognised for the duplicate check."

[dependencies]
kgb-core.workspace = true
kgb-store.workspace = true
# Pure reading functions: the text of a PDF or a workbook (kgb-extract) and of a .docx (kgb-docs).
# No data is shared between modules.
kgb-extract.workspace = true
kgb-docs.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
blake3.workspace = true
base64 = "0.22.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true
