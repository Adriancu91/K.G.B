[package]
name = "kgb-net"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "K.G.B. network transport (Etapa 6, step 6.5): carries signed synchronisation messages between the organization's devices with iroh (QUIC, end-to-end encrypted, authenticated with the device key)."

[dependencies]
kgb-core.workspace = true
kgb-store.workspace = true
uuid.workspace = true
iroh = "1.4.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "macros", "sync"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
