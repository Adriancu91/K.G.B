[package]
name = "kgb-net"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "K.G.B. network transport (Etapa 6, step 6.5): carries signed synchronisation messages between the organization's devices with iroh (QUIC, end-to-end encrypted, authenticated with the device key)."

[dependencies]
kgb-core.workspace = true
kgb-store.workspace = true
uuid.workspace = true
iroh = "1.4.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "macros", "sync", "fs"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# HTTPS requests to the external sources switched on by the owner (Etapa 7, D-062),
# e.g. ANAF company data. Both crates are already used by iroh: nothing new is downloaded.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# D-086: the host of an address the person asked for (already in the tree through reqwest, same version).
url = "2.5.8"

[dev-dependencies]
tempfile.workspace = true
