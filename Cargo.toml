[workspace]
resolver = "3"
members = ["crates/kgb-store", "crates/kgb-core", "modules/kgb-notes", "modules/kgb-pdf", "modules/kgb-sheets", "app/src-tauri"]
# Spike-urile Etapei 0 rămân proiecte independente, neatinse.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "LicenseRef-Kronos-Proprietary"

[workspace.dependencies]
kgb-store = { path = "crates/kgb-store" }
kgb-core = { path = "crates/kgb-core" }
kgb-notes = { path = "modules/kgb-notes" }
kgb-pdf = { path = "modules/kgb-pdf" }
kgb-sheets = { path = "modules/kgb-sheets" }
blake3 = { version = "1.8.7", features = ["pure"] }
crc32fast = "1.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
uuid = { version = "1.29.0", features = ["v4", "v5", "v7", "serde"] }
windows-sys = "0.61.2"
tracing = "0.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
zeroize = "1.9.1"
semver = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
