[workspace]
resolver = "3"
members = ["crates/kgb-store", "crates/kgb-core", "crates/kgb-net", "modules/kgb-notes", "modules/kgb-pdf", "modules/kgb-sheets", "modules/kgb-extract", "modules/kgb-planner", "modules/kgb-docs", "modules/kgb-business", "modules/kgb-permits", "modules/kgb-team", "modules/kgb-calc", "modules/kgb-write", "modules/kgb-news", "modules/kgb-market", "modules/kgb-appointments", "modules/kgb-contracts", "modules/kgb-vault", "modules/kgb-maintenance", "modules/kgb-recipes", "app/src-tauri"]
# Spike-urile Etapei 0 rămân proiecte independente, neatinse.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "LicenseRef-Kronos-Proprietary"

[workspace.dependencies]
kgb-store = { path = "crates/kgb-store" }
kgb-core = { path = "crates/kgb-core" }
kgb-net = { path = "crates/kgb-net" }
kgb-notes = { path = "modules/kgb-notes" }
kgb-pdf = { path = "modules/kgb-pdf" }
kgb-sheets = { path = "modules/kgb-sheets" }
kgb-extract = { path = "modules/kgb-extract" }
kgb-planner = { path = "modules/kgb-planner" }
kgb-docs = { path = "modules/kgb-docs" }
kgb-business = { path = "modules/kgb-business" }
kgb-permits = { path = "modules/kgb-permits" }
kgb-market = { path = "modules/kgb-market" }
kgb-team = { path = "modules/kgb-team" }
kgb-calc = { path = "modules/kgb-calc" }
kgb-news = { path = "modules/kgb-news" }
kgb-appointments = { path = "modules/kgb-appointments" }
kgb-contracts = { path = "modules/kgb-contracts" }
kgb-vault = { path = "modules/kgb-vault" }
kgb-maintenance = { path = "modules/kgb-maintenance" }
kgb-recipes = { path = "modules/kgb-recipes" }
kgb-write = { path = "modules/kgb-write" }
blake3 = { version = "1.8.7", features = ["pure"] }
# Writing .xlsx (kgb-sheets, kgb-recipes).
rust_xlsxwriter = "0.102.0"
crc32fast = "1.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
uuid = { version = "1.29.0", features = ["v4", "v5", "v7", "serde"] }
windows-sys = "0.61.2"
tracing = "0.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
zeroize = "1.9.1"
semver = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tempfile = "3.27.0"

# Debug builds keep only line tables: the full debug info of the test
# binaries (iroh included) made the Windows linker fail with LNK1318.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
strip = true
