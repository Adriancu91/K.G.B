[package]
name = "kgb-s3-tauri-shell"
version = "0.0.1"
edition = "2024"
publish = false
description = "K.G.B. Etapa 0 spike S3: Tauri 2 window calling the S1 store. PROTOTYPE."

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29", features = ["v7"] }
kgb-store-spike = { path = "../../s1-storage" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
