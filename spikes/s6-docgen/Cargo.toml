[package]
name = "kgb-docgen-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Spike S6 (Etapa 4, pasul 4.7): generarea documentelor DOCX/PDF din modele.
# Variante măsurate separat prin feature-uri, ca să vedem cât adaugă fiecare.
[features]
default = ["docxrs", "typst", "typst-fonts"]
docxrs = ["dep:docx-rs"]
typst = ["dep:typst", "dep:typst-pdf", "dep:typst-layout"]
# Typst's own fonts built into the program (measured separately: they are most of the size).
typst-fonts = ["typst", "dep:typst-assets"]

[dependencies]
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
serde_json = "1.0.154"
lopdf = "0.47.0"
docx-rs = { version = "=0.4.22", optional = true }
typst = { version = "=0.15.1", optional = true }
typst-pdf = { version = "=0.15.1", optional = true }
typst-layout = { version = "=0.15.1", optional = true }
typst-assets = { version = "=0.15.1", optional = true, features = ["fonts"] }

[profile.release]
strip = true
