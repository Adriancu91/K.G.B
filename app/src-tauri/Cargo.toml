[package]
name = "kgb-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "K.G.B. desktop app (Tauri 2 + React/TS)."

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
kgb-core.workspace = true
kgb-net.workspace = true
kgb-store.workspace = true
kgb-notes.workspace = true
kgb-pdf.workspace = true
kgb-sheets.workspace = true
kgb-write.workspace = true
kgb-extract.workspace = true
kgb-planner.workspace = true
kgb-docs.workspace = true
kgb-business.workspace = true
kgb-permits.workspace = true
kgb-market.workspace = true
kgb-team.workspace = true
kgb-calc.workspace = true
kgb-news.workspace = true
kgb-appointments.workspace = true
tracing.workspace = true
# tray-icon: K.G.B. stays next to the clock (7.4m-3); the tray code was
# already downloaded with Tauri at this version.
tauri = { version = "2.12", features = ["tray-icon"] }
# System file dialogs (open/save) for importing and exporting documents (Etapa 3).
tauri-plugin-dialog = "=2.8.4"
# Windows desktop notifications for reminders, only while the app runs (Etapa 4, D-044).
# Used from Rust only: the web page gets no notification permission.
tauri-plugin-notification = "=2.8.0"
base64 = "0.22.1"
# The phone page (7.4m): a small HTTP server on the local network, off by
# default. The same versions iroh/reqwest already bring: nothing new downloaded.
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
# kgb.local on the office network (7.4m-4): sharing UDP port 5353 with
# Windows' own mDNS needs address reuse. Already used by tokio/iroh at this
# version: nothing new downloaded.
socket2 = "0.6.5"
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# D-084: Windows' own print dialog (PrintDlgW) and its handles.
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Registry", "Win32_Foundation", "Win32_Security", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_Memory"] }
# "Ce se aude acum" on the start page (7.4e): the Windows media controls.
# Already used by Tauri at this version, so nothing new is downloaded.
# The PDF of the COS windows' pages (D-081): IStream, to read WebView2's PrintToPdfStream.
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
# D-081: PrintToPdfStream of WebView2. The same version Tauri / wry already bring (Cargo.lock), used directly.
webview2-com = "=0.39.1"

