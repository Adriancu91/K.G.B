[package]
name = "kgb-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "K.G.B. desktop app (Tauri 2 + React/TS)."

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
kgb-core.workspace = true
kgb-store.workspace = true
kgb-notes.workspace = true
kgb-pdf.workspace = true
tracing.workspace = true
tauri = { version = "2.12", features = [] }
# System file dialogs (open/save) for importing and exporting documents (Etapa 3).
tauri-plugin-dialog = "=2.8.4"
base64 = "0.22.1"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
